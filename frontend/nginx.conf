server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ───────────────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── API proxy ────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Health endpoints (used by depends_on healthcheck + scheduler status) ──
    location /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Social media bot preview for invite links ────────────────────
    location ~ ^/invite/(.+)$ {
        set $invite_token $1;

        # Detect social media crawlers — serve OG-tagged HTML from backend
        if ($http_user_agent ~* "facebookexternalhit|Twitterbot|WhatsApp|Discordbot|Slackbot|LinkedInBot|TelegramBot|Googlebot") {
            proxy_pass http://api:8000/api/invite-preview/$invite_token;
            break;
        }

        # Real users get the React SPA
        try_files /index.html =404;
    }

    # ── Tracked landing links (/l/{token}) ───────────────────────────
    location ~ ^/l/(.+)$ {
        set $landing_token $1;

        # Detect social media crawlers — serve OG-tagged HTML from backend
        if ($http_user_agent ~* "facebookexternalhit|Twitterbot|WhatsApp|Discordbot|Slackbot|LinkedInBot|TelegramBot|Googlebot") {
            proxy_pass http://api:8000/api/landing-preview/$landing_token;
            break;
        }

        # Real users — proxy to backend for click tracking + redirect
        proxy_pass http://api:8000/l/$landing_token;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Clean landing URL ────────────────────────────────────────────
    # /landing → serve the static landing.html from the build output
    location = /landing {
        try_files /landing.html =404;
    }

    # If someone hits /landing.html directly, redirect to clean URL
    location = /landing.html {
        return 301 /landing$is_args$args;
    }

    # ── SPA fallback ─────────────────────────────────────────────────
    # All other routes: try static file first, then fall back to
    # index.html so React Router handles client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Compression ──────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;
}
